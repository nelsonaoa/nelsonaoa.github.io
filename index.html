<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案與應用程式總覽 (Projects & Apps)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>我的數位專案與應用程式</h1>
        <p class="subtitle">個人開發的 Android App、教學互動模擬與實用網頁工具彙整</p>
    </header>

    <!-- 分類篩選按鈕 -->
    <nav id="filter-nav">
        <button class="active" data-filter="all">全部專案</button>
        <button data-filter="app">Android App</button>
        <button data-filter="web">網頁工具</button>
        <button data-filter="sim">互動模擬</button>
    </nav>

    <!-- 專案大按鈕卡片區 -->
    <main class="project-grid" id="project-grid">

        <!-- 專案 1：植屬於你 -->
        <a href="./plant/index.html" class="project-card" data-category="app">
            <div>
                <div class="card-header">
                <img src="plant/icon-plant.jpg" alt="植屬於你 App 圖示" class="project-icon-img">
                <span class="project-badge">Android App</span>
            </div>
                <h2>植屬於你</h2>
                <p>專為植物愛好者打造的科學化分類與生長歷程紀錄工具，支援個人 Google Drive 雲端備份與智慧關懷提醒。</p>
            </div>
            <div class="card-footer">
                <span>前往專案與隱私權政策</span>
                <span class="arrow">→</span>
            </div>
        </a>
        <!-- 專案 2：記帳軟體 -->
        <a href="./money/index.html" class="project-card" data-category="app">
            <div>
                <div class="card-header">
                <img src="money/icon-money.jpg" alt="植屬於你 App 圖示" class="project-icon-img">
                <span class="project-badge">Android App</span>
            </div>
                <h2>記帳軟體</h2>
                <p>簡單明瞭的記帳軟體，還在設計中。</p>
            </div>
            <div class="card-footer">
                <span>前往專案與隱私權政策</span>
                <span class="arrow">→</span>
            </div>
        </a>

        <!-- 專案 3：數學網站 -->
        <a href="./school-tool/index.html" class="project-card theme-blue" data-category="web">
            <div>
                <div class="card-header">
                    <span class="project-icon">📋</span>
                    <span class="project-badge">網頁工具</span>
                </div>
                <h2>愛的數學你我他</h2>
                <p>還在搬家中，好懶。</p>
            </div>
            <div class="card-footer">
                <span>開啟工具頁面</span>
                <span class="arrow">→</span>
            </div>
        </a>


    </main>

    <div class="footer">
        <p>聯絡開發者：<a href="mailto:s973180@gmail.com">s973180@gmail.com</a></p>
        <p>&copy; 2026 All rights reserved.</p>
    </div>

    <script>
        const filterButtons = document.querySelectorAll('#filter-nav button');
        const projectCards = document.querySelectorAll('.project-card');

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const filter = button.getAttribute('data-filter');

                projectCards.forEach(card => {
                    const category = card.getAttribute('data-category');
                    if(filter === 'all' || category === filter)
                    {
                        card.classList.remove('hidden');
                    }
                    else
                    {
                        card.classList.add('hidden');
                    }
                });
            });
        });
    </script>

</body>
</html>
